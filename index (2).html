<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موزیک پلیر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#f4f0ea; --surface:#fffdf9; --ink:#241f2e; --muted:#7a7385; --accent:#e4572e; --accent-ink:#fff; --line:#e3ddd3; --disc:#241f2e; --disc-label:#e4572e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15121c; --surface:#1f1b29; --ink:#f1ecf7; --muted:#9a93a8; --accent:#ff7a4d; --accent-ink:#1a1008; --line:#2e2839; --disc:#0b0910; --disc-label:#ff7a4d;}
}
:root[data-theme="dark"]{--bg:#15121c; --surface:#1f1b29; --ink:#f1ecf7; --muted:#9a93a8; --accent:#ff7a4d; --accent-ink:#1a1008; --line:#2e2839; --disc:#0b0910; --disc-label:#ff7a4d;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:460px;padding:20px 18px 28px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;font-weight:800;margin:0}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.disc{width:min(62vw,240px);aspect-ratio:1;border-radius:50%;background:
  repeating-radial-gradient(circle at center,var(--disc) 0 3px,color-mix(in srgb,var(--disc) 82%,#888) 3px 4px);
  position:relative;animation:spin 5s linear infinite;animation-play-state:paused}
.disc.on{animation-play-state:running}
.disc::before{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--disc-label)}
.disc::after{content:"";position:absolute;inset:48.5%;border-radius:50%;background:var(--surface)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.meta{text-align:center;max-width:100%}
.title{font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.seek{width:100%;display:flex;align-items:center;gap:10px;direction:ltr;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);height:24px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr}
.ctrl button{background:none;border:0;color:var(--ink);font-size:24px;width:48px;height:48px;border-radius:50%;cursor:pointer}
.ctrl button.on{color:var(--accent)}
.ctrl .play{background:var(--accent);color:var(--accent-ink);width:64px;height:64px;font-size:26px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:flex;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer}
li .n{width:26px;text-align:center;color:var(--muted);font-size:13px}
li .t{flex:1;min-width:0}
li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li.cur .t b,li.cur .n{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;line-height:1.9}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>موزیک پلیر</h1>
    <button class="add" id="add">افزودن آهنگ</button>
    <input id="files" type="file" accept="audio/*" multiple hidden>
  </header>

  <section class="stage">
    <div class="disc" id="disc"></div>
    <div class="meta">
      <div class="title" id="title">آهنگی انتخاب نشده</div>
      <div class="sub" id="sub">از دکمه‌ی بالا فایل‌های گوشی را اضافه کن</div>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="bar" min="0" max="100" value="0" step="0.1" aria-label="موقعیت پخش">
      <span id="dur">0:00</span>
    </div>
    <div class="ctrl">
      <button id="shuffle" aria-label="شافل">🔀</button>
      <button id="prev" aria-label="قبلی">⏮</button>
      <button id="play" class="play" aria-label="پخش">▶</button>
      <button id="next" aria-label="بعدی">⏭</button>
      <button id="repeat" aria-label="تکرار">🔁</button>
    </div>
  </section>

  <ul id="list"></ul>
  <div class="empty" id="empty">لیست خالیه.<br>روی «افزودن آهنگ» بزن و چند تا فایل صوتی از گوشی انتخاب کن.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const audio = new Audio();
let tracks = [], idx = -1, shuffle = false, repeat = false;

const fmt = s => { if (!isFinite(s)) return "0:00"; const m = Math.floor(s/60), r = Math.floor(s%60); return m + ":" + String(r).padStart(2,"0"); };
const clean = n => n.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ");

$("add").onclick = () => $("files").click();
$("files").onchange = e => {
  const first = tracks.length;
  for (const f of e.target.files) tracks.push({ name: clean(f.name), url: URL.createObjectURL(f) });
  e.target.value = "";
  render();
  if (idx < 0 && tracks.length) load(first, true);
};

function render(){
  $("empty").style.display = tracks.length ? "none" : "block";
  $("list").innerHTML = tracks.map((t,i) =>
    `<li data-i="${i}" class="${i===idx?'cur':''}"><span class="n">${i===idx&&!audio.paused?'♪':i+1}</span><span class="t"><b></b></span></li>`).join("");
  [...$("list").children].forEach((li,i) => { li.querySelector("b").textContent = tracks[i].name; li.onclick = () => load(i, true); });
}

function load(i, autoplay){
  idx = i; const t = tracks[i];
  audio.src = t.url;
  $("title").textContent = t.name;
  $("sub").textContent = "آهنگ " + (i+1) + " از " + tracks.length;
  if (autoplay) audio.play().catch(()=>{});
  render(); updateSession();
}

function step(dir){
  if (!tracks.length) return;
  let n;
  if (shuffle && tracks.length > 1) { do { n = Math.floor(Math.random()*tracks.length); } while (n === idx); }
  else n = (idx + dir + tracks.length) % tracks.length;
  load(n, true);
}

$("play").onclick = () => { if (idx < 0) return; audio.paused ? audio.play() : audio.pause(); };
$("next").onclick = () => step(1);
$("prev").onclick = () => { if (audio.currentTime > 3) audio.currentTime = 0; else step(-1); };
$("shuffle").onclick = e => { shuffle = !shuffle; e.currentTarget.classList.toggle("on", shuffle); };
$("repeat").onclick = e => { repeat = !repeat; e.currentTarget.classList.toggle("on", repeat); };

audio.onplay = () => { $("play").textContent = "⏸"; $("disc").classList.add("on"); render(); };
audio.onpause = () => { $("play").textContent = "▶"; $("disc").classList.remove("on"); render(); };
audio.onloadedmetadata = () => { $("dur").textContent = fmt(audio.duration); };
audio.ontimeupdate = () => {
  $("cur").textContent = fmt(audio.currentTime);
  if (audio.duration) $("bar").value = audio.currentTime / audio.duration * 100;
};
audio.onended = () => { if (repeat) { audio.currentTime = 0; audio.play(); } else step(1); };
$("bar").oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };

function updateSession(){
  if (!("mediaSession" in navigator) || idx < 0) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: tracks[idx].name, artist: "موزیک پلیر" });
}
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", () => audio.play());
  ms.setActionHandler("pause", () => audio.pause());
  ms.setActionHandler("nexttrack", () => step(1));
  ms.setActionHandler("previoustrack", () => step(-1));
  ms.setActionHandler("seekto", d => { audio.currentTime = d.seekTime; });
}
</script>
</body>
</html>
